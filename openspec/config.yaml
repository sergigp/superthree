schema: spec-driven

context: |
  TypeScript code follows the /typescript-architect skill's DDD + hexagonal conventions
  (layers, naming, ports in infrastructure/, functional style, errors as values with better-result)

operations:
  apply:
    guidance:
      - Invoke the /typescript-architect skill and follow its conventions when implementing TypeScript code
      - End every task with a commit
      - |
        Walking skeleton task: create only the structure and wiring described in the task.
        Do not implement real logic yet, even if it looks trivial. If building the skeleton
        shows that design.md's types, signatures or call stack are wrong, stop and propose
        an artifact update (/opsx:update) before continuing.
      - |
        Every TDD task is exactly one red-green-refactor cycle, done in this order:
        1. RED — Write only the one test named in the task, following /typescript-architect's
           testing conventions (acceptance tests drive an application adapter with real
           SQLite persistence and fakes for external dependencies; infrastructure tests use
           the real dependency). Run it and confirm it FAILS on an assertion. A type error
           or a thrown exception is not a valid red: first add whatever type-checking stub
           code the test needs, then re-run until it fails on the assertion.
           If it passes immediately, the behaviour already exists: tell the user and ask
           whether to keep the test and skip the cycle.
        2. GREEN — Make the smallest production-code change that makes this test pass.
           Do not add behaviour that no failing test requires yet; later tasks will drive it.
           Run the typecheck (`tsc --noEmit`) and the full test suite (`vitest run`);
           everything must pass.
        3. REFACTOR — Clean up only the code touched in this cycle (duplication, naming,
           structure per /typescript-architect) without changing behaviour. Re-run the
           typecheck and full suite; everything must still pass. Skip this step if nothing
           needs cleaning.
        Then mark the task done.
      - Never write production logic before a failing test that requires it, and never
        write more than one new test per cycle.

rules:
  design:
    - |
      On design.md add these sections that will be used as an overview of the design. Don't add anything else,
      we want to keep this short and simple
      ## Files
      Every file created or changed, one line each on why it lives there.
      ## Types & Signatures
      Code blocks defining the new/changed Zod schemas (domain types inferred from them),
      types and function signatures only —
      no implementation bodies. A human should read these in seconds and say
      "right" or "wrong."
      ## Call Stack
      For each main flow: what calls what, top to bottom. And what are the call parameters.
      ## Test Plan
      The ordered list of TDD cycles. Two groups, in this order:
      1. Acceptance tests (application adapter: HTTP route, event subscriber, or task),
         ordered from simplest/happy path to edge cases and errors. Pure core functions
         (scheduler, playlist generation) get fast-check property tests for their invariants;
         other behaviour tests (domain service directly) only where /typescript-architect
         allows them.
      2. Infrastructure tests, one group per real adapter the change adds or changes.
      For each: test name (`it('should ...')`) and what it asserts. One test = one cycle.
    - Be very concise — no prose narration, no alternatives-considered
      discussion, no rationale paragraphs, unless a decision is genuinely
      non-obvious and needs one sentence to avoid it being "fixed" later
    - Follow /typescript-architect's layering and naming conventions when naming
      files, types, and functions in the contract
  tasks:
    - |
      Structure tasks.md as a vertical slice built outside-in. Do NOT group tasks by
      layer (domain / application / infrastructure). Use exactly these sections, in order:

      ## 1. Walking skeleton
      One task that creates every file, type and signature from design.md
      (## Files, ## Types & Signatures) across all layers, wired end-to-end
      (route/subscriber/task registered, dependencies constructed in the composition root),
      plus the fakes for any new or changed ports. Bodies return trivial hardcoded values
      (e.g. `Result.ok(undefined)`, `[]`, `undefined`, a fixed response) — never
      `throw new Error('not implemented')`. Done when: `tsc --noEmit` succeeds and all
      existing tests pass. No new behaviour and no new tests in this task.

      ## 2. Behaviour (TDD)
      One task per acceptance/behaviour test from design.md's Test Plan, in the same order.
      Task text: the test name + the behaviour it drives. Each task is one
      red-green-refactor cycle (see apply guidance).

      ## 3. Infrastructure adapters (TDD)
      One task per infrastructure test from the Test Plan, grouped by adapter. Each
      replaces skeleton stub code in a real adapter via one red-green-refactor cycle.

      # ## 4. Verification
      # tsc --noEmit, vitest run, lint, and manual check via the Playwright smoke tests (smoke-tests/)
      # or running the server locally when the change is user-visible.
